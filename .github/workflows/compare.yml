name: Check Updates

on:
  schedule:
    - cron: '0 16 */1 * *'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compare versions
        run: |
          export REMOTEVERSION=$(curl -s https://api.github.com/repos/usememos/memos/tags | jq -r '.[0].name')
          export LOCALVERSION=$(curl -s https://api.github.com/repos/oopses/memos-binary/releases/latest | jq -r '.tag_name')
          bash compare.sh

      - name: Trigger release
        if: ${{ env.SYNCED == 0 }}
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'oopses',
              repo: 'memos-binary',
              workflow_id: 'build.yml',
              ref: 'main'
            })

      - name: Delete workflow runs
        if: ${{ env.SYNCED == 1 }}
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 8
