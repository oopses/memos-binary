name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: 'stable'
        check-latest: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Clone upstream memos
      run: |
        LATEST_APP=$(curl -s https://api.github.com/repos/usememos/memos/tags | jq -r '.[0].name')
        echo "Latest upstream tag: $LATEST_APP"
        git clone -b "$LATEST_APP" https://github.com/usememos/memos
        npm install -g pnpm@11

    - name: Build Frontend
      run: |
        cd memos/web
        pnpm i --frozen-lockfile
        pnpm build
        mkdir -p ../artifact
        rm -rf ../server/router/frontend/dist
        mkdir -p ../server/router/frontend
        cp -R dist ../server/router/frontend/dist
        cd ../..

    - name: Build binaries
      run: |
        cd memos
        mkdir -p artifact

        build() {
          GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -o memos ./cmd/memos/main.go
          rm -f artifact/*
          cp memos artifact/memos
          cd artifact
          tar -czvf ../memos-$1-$2.tar.gz *
          cd ..
        }

        build windows amd64
        build freebsd amd64
        build darwin amd64
        build linux amd64

        cd ..

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: memos-pre-built
        path: |
          memos/memos-windows-amd64.tar.gz
          memos/memos-freebsd-amd64.tar.gz
          memos/memos-darwin-amd64.tar.gz
          memos/memos-linux-amd64.tar.gz

    - name: Generate release tag
      id: tag
      run: |
        RELEASE_TAG=$(curl -s https://api.github.com/repos/usememos/memos/tags | jq -r '.[0].name')
        echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

    - name: Create release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        files: |
          memos/memos-windows-amd64.tar.gz
          memos/memos-freebsd-amd64.tar.gz
          memos/memos-darwin-amd64.tar.gz
          memos/memos-linux-amd64.tar.gz

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 1
        keep_minimum_runs: 8
